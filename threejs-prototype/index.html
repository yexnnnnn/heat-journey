// ════════════════════════════ 1. Simulation model (illustrative) ════════════════════════════
const SEASON = {
  summer: { zh: '夏', en: 'Summer', lab: 10, gh: 60, dist: 150 },
  mid:    { zh: '春秋', en: 'Spring/Autumn', lab: 25, gh: 180, dist: 350 },
  winter: { zh: '冬', en: 'Winter', lab: 40, gh: 300, dist: 500 },
};
const USERS = [
  { k: 'lab', zh: '机器人实验室', en: 'Robot lab', need: 35 },
  { k: 'gh', zh: '温室', en: 'Greenhouse', need: 45 },
  { k: 'dist', zh: '区域供热', en: 'District heating', need: 65 },
];
const PRICE_ELEC = 0.20, PRICE_HEAT = 0.07; // £/kWh

function simulate(s) {
  const P = 1000 * s.load;                 // IT electricity, kW
  const Q = s.cooling ? P : P;             // ≈100% becomes heat
  const dT = 10 * s.load * (0.6 / s.flow); // coolant temperature rise
  const Tr = s.supply + dT;                // primary return temp
  const chip = s.cooling ? s.supply + dT + 22 * s.load + 3 : s.chipOverride;
  const T2 = Tr - 3;                       // secondary supply (HX approach 3°C)
  const COP = 0.4 * (65 + 273) / (65 - T2 + 10);
  const D = SEASON[s.season];
  let avail = 0.8 * Q, direct = 0, hpSrc = 0, hpDel = 0, hpElec = 0;
  const served = {};
  for (const u of USERS) if (T2 >= u.need) {
    const take = Math.min(D[u.k], avail); avail -= take; direct += take;
    served[u.k] = { mode: 'direct', frac: take / D[u.k] };
  }
  for (const u of USERS) if (T2 < u.need) {
    if (!s.hp) { served[u.k] = { mode: 'none', frac: 0 }; continue; }
    const src = Math.min(D[u.k] * (1 - 1 / COP), avail); avail -= src;
    const del = src / (1 - 1 / COP);
    hpSrc += src; hpDel += del; hpElec += del / COP;
    served[u.k] = { mode: 'hp', frac: del / D[u.k] };
  }
  const recovered = direct + hpSrc, rejected = Q - recovered;
  const chillerFactor = s.supply < 30 ? 0.03 + (30 - s.supply) * 0.025 : 0.03;
  const coolingElec = Q * 0.02 + rejected * chillerFactor;
  const total = P + coolingElec + hpElec;
  const usable = direct + hpDel;
  const cost = total * PRICE_ELEC - usable * PRICE_HEAT;
  return { P, Q, Tr, chip, T2, COP, direct, hpDel, hpElec, recovered, rejected, usable, coolingElec, total, cost,
    recoveryPct: recovered / Q, served, throttle: chip > 85 };
}

function tempColor(t) {
  if (t <= STOPS[0][0]) return STOPS[0][1].clone();
  for (let k = 1; k < STOPS.length; k++) if (t <= STOPS[k][0]) {
    const [t0, c0] = STOPS[k - 1], [t1, c1] = STOPS[k];
    return c0.clone().lerp(c1, (t - t0) / (t1 - t0));
  }
  return STOPS[STOPS.length - 1][1].clone();
}

// ════════════════════════════ 6. Applying a screen to the 3D scene ════════════════════════════
let night = 0, nightTarget = 0, tankFill = 0.5, tankTarget = 0.5;

function applyScene() {
  const sc = SCREENS[state.i];
  const r = sim();
  // focus / dim
  for (const name in units) {
    const u = units[name];
    const focused = !sc.focus || sc.focus.includes(name);
    u.dim = focused ? 1 : 0.1;
    if (u.label) u.label.style.opacity = focused ? 1 : 0.15;
  }
  units.Packet.dim = sc.packet !== undefined ? 1 : 0;
  // pipe colors / activity
  const temps = { PrimaryHot: r.Tr, PrimaryCold: state.supply, SecondaryHot: r.T2, SecondaryMain: r.T2, ToGreenhouse: r.T2, ToTank: r.T2,
    Return: Math.max(r.T2 - 10, 22), HeatPumpOut: 65, Reject: r.T2 };
  for (const n in pipes) {
    const p = pipes[n];
    let visible = sc.pipes !== 'off', colored = false;
    if (sc.pipes === 'primary') colored = p.d.set === 'primary';
    if (sc.pipes === 'all') colored = p.d.set !== 'hp' || state.hp;
    if (p.d.set === 'primary' && !state.cooling) colored = false;
    if (n === 'Reject' && sc.pipes === 'all') colored = r.rejected > 1;
    p.active = colored; p.temp = temps[n];
    p.speed = (p.d.set === 'primary' ? state.flow * 2.2 : 1.1) * (0.4 + state.load);
    const col = colored ? tempColor(p.temp) : GRAY;
    p.tube.material.color.copy(col); p.tube.material.emissive.copy(colored ? col : new THREE.Color(0)).multiplyScalar(0.35);
    p.inst.material.color.copy(col).lerp(new THREE.Color('#ffffff'), 0.45);
    p.inst.visible = colored; units[n].group.visible = visible;
  }
  // heat pump
  compressor.material.color.set(state.hp ? '#F85149' : '#6E7681');
  compressor.material.emissive.set(state.hp ? '#F85149' : '#000000');
  // heat exchanger plates follow temperatures
  hxPlates.forEach((m, k) => { const c = tempColor(k % 2 ? r.T2 : r.Tr); m.material.color.copy(c); m.material.emissive.copy(c); });
  // sky
  nightTarget = sc.w === 'timeline' ? nightFromHour(state.hour) : (sc.night ? 1 : 0);
  // pins
  pinObjs.forEach(o => { o.element.style.display = sc.pins ? 'flex' : 'none'; });
  // packet target
  if (sc.packet !== undefined) packetTarget = sc.packet;
  controls.autoRotate = false;
}
const nightFromHour = h => { const d = Math.cos(((h - 13) / 24) * Math.PI * 2); return THREE.MathUtils.clamp(0.5 - d * 0.9, 0, 1); };

// ════════════════════════════ 7. Render loop ════════════════════════════
const clock = new THREE.Clock();
const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const r = sim(); const sc = SCREENS[state.i];

  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.3); const k = ease(tween.t);
    camera.position.lerpVectors(tween.fromP, tween.toP, k); controls.target.lerpVectors(tween.fromT, tween.toT, k);
    if (tween.t >= 1) tween = null;
  }
  controls.update();

  // opacity easing for focus
  for (const name in units) {
    const u = units[name];
    for (const m of u.mats) m.opacity += ((m.userData.base ?? 1) * u.dim - m.opacity) * Math.min(1, dt * 6);
  }
  // GPUs
  const chipT = r.chip;
  const gpuCol = tempColor(THREE.MathUtils.mapLinear(chipT, 40, 95, 30, 70));
  gpuMats.forEach(({ mat, rack, k }) => {
    const flick = 0.55 + 0.45 * Math.abs(Math.sin(t * (3 + rack) + k * 1.7));
    mat.color.copy(gpuCol); mat.emissive.copy(gpuCol).multiplyScalar(flick * (0.3 + state.load) * (r.throttle ? (Math.sin(t * 12) > 0 ? 1.4 : 0.2) : 1));
  });
  // cooling off ramp
  if (!state.cooling) { state.chipOverride = Math.min(98, state.chipOverride + dt * 6); if (sc.w === 'cooling') updateLive(); }

  // particles
  for (const n in pipes) {
    const p = pipes[n]; if (!p.active) continue;
    p.offset = (p.offset + dt * p.speed / p.len) % 1;
    for (let k = 0; k < p.count; k++) {
      const u = (k / p.count + p.offset) % 1;
      p.path.getPointAt(u, tmpV); tmpM.makeTranslation(tmpV.x, tmpV.y, tmpV.z + p.d.r * 0.2);
      p.inst.setMatrixAt(k, tmpM);
    }
    p.inst.instanceMatrix.needsUpdate = true;
  }
  // packet
  packetT += (packetTarget - packetT) * Math.min(1, dt * 1.2);
  packetPath.getPointAt(THREE.MathUtils.clamp(packetT, 0, 1), packet.position);
  packetLight.position.copy(packet.position); packetLight.intensity = units.Packet.dim * (6 + Math.sin(t * 6) * 2);
  packet.scale.setScalar(1 + Math.sin(t * 6) * 0.1);
  packet.material.color.copy(tempColor(THREE.MathUtils.lerp(70, 45, THREE.MathUtils.clamp(packetT * 4, 0, 1))));

  // equipment animation
  impeller.rotation.z += dt * 8 * state.flow * (state.cooling ? 1 : 0);
  const rejecting = r.rejected > 1 && SCREENS[state.i].pipes === 'all';
  fans.forEach(f => f.rotation.y += dt * (rejecting ? 10 * (r.rejected / 800 + 0.2) : 0.5));
  compressor.scale.setScalar(state.hp ? 1 + Math.sin(t * 14) * 0.04 : 1);

  // tank
  if (sc.w === 'store') tankTarget = 0.5 + 0.45 * Math.sin(t * 0.8);
  tankFill += (tankTarget - tankFill) * Math.min(1, dt * 2);
  tankLevel.scale.y = Math.max(0.05, tankFill * 2.6); tankLevel.position.y = -4.3 + tankLevel.scale.y / 2;

  // sky / lights
  night += (nightTarget - night) * Math.min(1, dt * 2);
  scene.background.copy(SKY_DAY).lerp(SKY_NIGHT, night);
  sun.intensity = 1.6 * (1 - night * 0.8); hemi.intensity = 1.1 * (1 - night * 0.6);

  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}

  const sc = SCREENS[state.i]; if (!sc.clickRack) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  if (ray.intersectObjects(units.Rack3.group.children, false).length) go(state.i + 1);
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// ════════════════════════════ 8. UI: progress, metrics, panel ════════════════════════════
const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => n.toLocaleString('en-GB', { maximumFractionDigits: d, minimumFractionDigits: d });

function renderProgress() {
  const cur = SCREENS[state.i].step;
  $('#progress').innerHTML = STEPS.map(([n, en, zh], s) => {
    const cls = s === cur ? 'now' : s <= state.maxStep ? 'done' : '';
    return `<button class="${cls}" data-s="${s}" title="${en}">${n} ${zh}</button>`;
  }).join('');
  $('#progress').querySelectorAll('button').forEach(b => b.onclick = () => {
    const s = +b.dataset.s; if (s <= state.maxStep && s !== cur) go(SCREENS.findIndex(x => x.step === s));
  });
}

const METRICS = [
  { k: 'power', zh: '总功耗', en: 'Total power', v: r => fmt(r.total) + ' kW' },
  { k: 'chip', zh: '芯片温度', en: 'Chip temp', v: r => fmt(r.chip) + '°C', alert: r => r.throttle },
  { k: 'ret', zh: '回水温度', en: 'Return temp', v: r => fmt(r.Tr) + '°C' },
  { k: 'usable', zh: '可利用热', en: 'Usable heat', v: r => fmt(r.usable) + ' kW · ' + fmt(r.recoveryPct * 100) + '%' },
  { k: 'cost', zh: '净运行成本', en: 'Net cost', v: r => '£' + fmt(r.cost) + '/h' },
];
function renderMetrics() {
  const sc = SCREENS[state.i], r = sim();
  $('#metrics').innerHTML = METRICS.map((m, i) => {
    const on = i < sc.metrics; const alert = on && m.alert && m.alert(r);
    return `<div class="metric ${on ? '' : 'locked'} ${alert ? 'alert' : ''}"><div class="k">${m.zh} ${m.en}</div><div class="v">${on ? m.v(r) : '— 未解锁 locked'}</div></div>`;
  }).join('');
}

let toastTimer;
function toast(html, ms = 2600) {
  const el = $('#toast'); el.innerHTML = html; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// widgets: return HTML + a bind() for events
const W = {
  start: () => ({ html: `<button class="cta" id="w-start">开始 Start →</button>`, bind: () => $('#w-start').onclick = () => go(1) }),

  guess: () => ({
    html: [['A', '变成了"计算"', 'It becomes computation'], ['B', '大部分变成了热', 'Most of it becomes heat'], ['C', '存进了电池', 'Stored in batteries']]
      .map(([k, zh, en]) => `<button class="opt ${state.guess === k ? 'sel' : ''}" data-k="${k}"><b>${k}</b> · ${zh}<br/><span class="en">${en}</span></button>`).join(''),
    bind: () => document.querySelectorAll('.opt[data-k]').forEach(b => b.onclick = () => { state.guess = b.dataset.k; renderPanel(); }),
  }),

  pins: () => ({ html: `<div class="card">已查看 Opened: <b>${state.pinsSeen.size} / 4</b></div>` }),

  load: () => ({
    html: `<div class="row">GPU 负载 Load <b id="v-load"></b></div><input type="range" id="i-load" min="0.3" max="1" step="0.01" value="${state.load}">
      <div class="row">机架功耗 Rack power <b id="v-rack"></b></div><div class="row" style="margin-top:6px">芯片温度 Chip temp <b id="v-chip"></b></div>`,
    bind: () => { $('#i-load').oninput = e => { state.load = +e.target.value; updateLive(); }; },
    live: r => { $('#v-load').textContent = fmt(state.load * 100) + '%'; $('#v-rack').textContent = fmt(40 * state.load, 1) + ' kW'; $('#v-chip').textContent = fmt(r.chip) + '°C'; },
  }),

  energy: () => {
    const right = state.guess === 'B';
    const g = state.guess ? `<div class="card">你在开场选的是 <b>${state.guess}</b> —— ${right ? '<span class="ok">答对了！</span>' : '<span class="warn">其实是 B。</span>'}</div>` : '';
    const kw = 40 * state.load;
    return { html: `${g}<div class="card">⚡ 电 Electricity in<div class="bar" style="width:100%;background:#E3B341">${fmt(kw, 1)} kW</div>
      ♨ 热 Heat out<div class="bar" style="width:99%;background:#F85149">≈ ${fmt(kw, 1)} kW (≈100%)</div>
      <span class="en">1 kWh in → ≈ 1 kWh of heat out</span></div>` };
  },

  cooling: () => ({
    html: `<button class="cta ${state.cooling ? 'danger' : 'ghost'}" id="w-cool">${state.cooling ? '关掉冷却 Turn off cooling' : '恢复冷却 Restore cooling'}</button>
      <div class="row">芯片温度 Chip temp <b id="v-chip"></b></div><div id="v-alarm" class="card" style="margin-top:10px"></div>`,
    bind: () => $('#w-cool').onclick = () => { state.cooling = !state.cooling; state.chipOverride = sim().chip; if (state.cooling) state.chipOverride = 70; applyScene(); renderPanel(); },
    live: r => {
      $('#v-chip').textContent = fmt(r.chip) + '°C';
      $('#v-alarm').innerHTML = r.throttle ? '<span class="bad verdict">⚠ 降频 THROTTLING —— 算力下降，芯片在自我保护</span>'
        : state.cooling ? '<span class="ok">冷却正常 Cooling OK</span>' : '<span class="warn">温度上升中… Rising…</span>';
    },
  }),

  trace: () => ({ html: `<button class="cta" id="w-trace">追踪热量 Trace the heat ▶</button>`, bind: () => $('#w-trace').onclick = () => go(state.i + 1) }),

  flow: () => ({
    html: `<div class="row">流量 Flow <b id="v-flow"></b></div><input type="range" id="i-flow" min="0.3" max="1" step="0.01" value="${state.flow}">
      <div class="row">供水 Supply <b>${fmt(state.supply)}°C</b></div><div class="row" style="margin-top:6px">回水 Return <b id="v-ret"></b></div>`,
    bind: () => $('#i-flow').oninput = e => { state.flow = +e.target.value; applyScene(); updateLive(); },
    live: r => { $('#v-flow').textContent = fmt(state.flow * 100) + '%'; $('#v-ret').textContent = fmt(r.Tr, 1) + '°C'; },
  }),

  hx: () => {
    const r = sim();
    return { html: `<div class="card"><div class="row">一次侧 Primary <b>${fmt(r.Tr)}°C → ${fmt(state.supply)}°C</b></div>
      <div class="row" style="margin-top:8px">二次侧 Secondary <b>${fmt(Math.max(r.T2 - 10, 22))}°C → ${fmt(r.T2)}°C</b></div></div>
      <div class="en">两套水被金属板隔开，热穿过板子，水不会混合。<br/>The loops are separated by metal plates; heat crosses, water doesn't.</div>` };
  },

  thermo: () => {
    const T2 = sim().T2;
    return {
      html: USERS.map(u => {
        const s = state.sent[u.k]; let v = '';
        if (s) v = T2 >= u.need ? `<span class="ok verdict">√ 直接可用</span>` : (u.need - T2 <= 4 ? `<span class="warn verdict">≈ 差一点</span>` : `<span class="bad verdict">× 不够热，需要热泵</span>`);
        return `<button class="opt" data-u="${u.k}"><div class="row"><span>送给 <b>${u.zh}</b></span>${v}</div><span class="en">需要 needs ${u.need}°C · 现有 have ${fmt(T2)}°C</span></button>`;
      }).join(''),
      bind: () => document.querySelectorAll('.opt[data-u]').forEach(b => b.onclick = () => { state.sent[b.dataset.u] = true; renderPanel(); }),
    };
  },

  heatpump: () => {
    const r = sim();
    return {
      html: `<div class="card" style="font-size:15px">⚡ <b>1</b> 份电 + ♨ <b>${fmt(r.COP - 1, 1)}</b> 份 ${fmt(r.T2)}°C 的热 = ♨ <b>${fmt(r.COP, 1)}</b> 份 65°C 的热
        <div class="en" style="margin:6px 0 0">COP ≈ ${fmt(r.COP, 1)} — 进水越热，热泵越省电 / the warmer the input, the cheaper the lift</div></div>
        <button class="cta ${state.hp ? 'ghost' : 'danger'}" id="w-hp">${state.hp ? '热泵运行中 Running ✓（点击关闭）' : '启动热泵 Start heat pump'}</button>`,
      bind: () => $('#w-hp').onclick = () => { state.hp = !state.hp; applyScene(); renderPanel(); },
    };
  },

  users: () => {
    const D = SEASON[state.season], when = { lab: '白天 Daytime', gh: '夜间 & 冬季 Nights & winter', dist: '全天 All day' };
    return { html: USERS.map(u => `<div class="card"><b>${u.zh} ${u.en}</b><div class="row" style="margin-top:4px"><span>${u.need}°C · ${D[u.k]} kW</span><span>${when[u.k]}</span></div></div>`).join('') };
  },

  timeline: () => ({
    html: `<div class="row">时间 Time <b id="v-hour"></b></div><input type="range" id="i-hour" min="0" max="23.9" step="0.1" value="${state.hour}">
      <div class="card"><svg viewBox="0 0 320 120" width="100%" id="chart"></svg>
      <div class="en" style="margin:0"><span style="color:#F0883E">━</span> 可回收热 supply &nbsp; <span style="color:#3FB950">━</span> 总热需求 demand</div></div><div id="v-tank" class="card"></div>`,
    bind: () => $('#i-hour').oninput = e => { state.hour = +e.target.value; nightTarget = nightFromHour(state.hour); updateLive(); },
    live: () => {
      const supply = 0.8 * 1000 * state.load, D = SEASON[state.season];
      const dem = h => D.lab * (h > 8 && h < 19 ? 1 : 0.3) + D.gh * (0.25 + 0.75 * nightFromHour(h)) + D.dist * (0.8 + 0.2 * Math.cos((h - 7) / 24 * Math.PI * 2));
      const maxV = 1000, X = h => h / 24 * 320, Y = v => 110 - v / maxV * 100;
      let path = ''; for (let h = 0; h <= 24; h += 0.5) path += (h ? 'L' : 'M') + X(h).toFixed(1) + ' ' + Y(dem(h)).toFixed(1);
      $('#chart').innerHTML = `<path d="M0 ${Y(supply)} L320 ${Y(supply)}" stroke="#F0883E" stroke-width="2.5" fill="none"/>
        <path d="${path}" stroke="#3FB950" stroke-width="2.5" fill="none"/>
        <line x1="${X(state.hour)}" x2="${X(state.hour)}" y1="4" y2="112" stroke="#fff" stroke-width="1.5"/>
        ${[0, 6, 12, 18].map(h => `<text x="${X(h) + 2}" y="119">${h}:00</text>`).join('')}`;
      const d = dem(state.hour), diff = supply - d;
      $('#v-hour').textContent = String(Math.floor(state.hour)).padStart(2, '0') + ':' + String(Math.round((state.hour % 1) * 60)).padStart(2, '0');
      tankTarget = THREE.MathUtils.clamp(0.5 + diff / 800, 0.08, 0.95);
      $('#v-tank').innerHTML = diff > 0
        ? `<span class="ok verdict">热有多余 +${fmt(diff)} kW</span> → 存进蓄热罐 charging the tank`
        : `<span class="warn verdict">热不够 ${fmt(diff)} kW</span> → 从蓄热罐取热 drawing from the tank`;
    },
  }),

  store: () => {
    const r = sim();
    return { html: `<div class="card"><div class="row">回收 Recovered <b>${fmt(r.recovered)} kW</b></div><div class="row" style="margin-top:6px">排到空气 Rejected <b>${fmt(r.rejected)} kW</b></div></div>
      <div class="en">看屋顶风扇：没人用的热越多，转得越快。<br/>Watch the roof fans — the more unused heat, the faster they spin.</div>` };
  },

  mission: () => ({
    html: [['reuse', '🌱 回收最多热量', 'Max heat reuse'], ['cost', '💰 成本最低', 'Lowest cost'], ['safe', '🛡 GPU 最安全', 'Safest GPUs']]
      .map(([k, zh, en]) => `<button class="opt ${state.mission === k ? 'sel' : ''}" data-m="${k}"><b>${zh}</b><br/><span class="en">${en}</span></button>`).join(''),
    bind: () => document.querySelectorAll('.opt[data-m]').forEach(b => b.onclick = () => { state.mission = b.dataset.m; renderPanel(); }),
  }),

  console: () => ({ html: consoleHTML() + `<div id="v-score" class="card"></div>`, bind: bindConsole, live: r => { liveConsole(r); liveScore(r); } }),

  compare: () => ({
    html: consoleHTML(true) + `<button class="cta ghost" id="w-save">保存为方案 A  Save as plan A</button><div id="v-cmp"></div>`,
    bind: () => { bindConsole(); $('#w-save').onclick = () => { state.planA = { ...sim(), supply: state.supply, load: state.load, season: state.season }; updateLive(); toast('已保存方案 A · Plan A saved'); }; },
    live: r => {
      liveConsole(r);
      const A = state.planA, B = { ...r, supply: state.supply };
      const rows = [['供水温度 Supply', x => fmt(x.supply) + '°C'], ['可利用热 Usable', x => fmt(x.usable) + ' kW'], ['回收率 Recovery', x => fmt(x.recoveryPct * 100) + '%'],
        ['热泵耗电 HP power', x => fmt(x.hpElec) + ' kW'], ['芯片温度 Chip', x => fmt(x.chip) + '°C' + (x.throttle ? ' ⚠' : '')], ['净成本 Net cost', x => '£' + fmt(x.cost) + '/h']];
      $('#v-cmp').innerHTML = `<table><tr><th></th><th>A</th><th>B 当前</th></tr>${rows.map(([n, f]) => `<tr><th>${n}</th><td>${A ? f(A) : '—'}</td><td><b>${f(B)}</b></td></tr>`).join('')}</table>`;
    },
  }),

  recap: () => {
    const r = sim(), m = { reuse: '回收最多热量', cost: '成本最低', safe: 'GPU 最安全' }[state.mission] || '—';
    return {
      html: ['① 电几乎全部变成热<br/><span class="en">Almost all electricity becomes heat</span>', '② 热靠水来搬<br/><span class="en">Water moves the heat</span>', '③ 温度决定热能用在哪里<br/><span class="en">Temperature decides where heat is useful</span>']
        .map(x => `<div class="card"><b>${x}</b></div>`).join('') +
        `<div class="card">你的目标 Your goal: <b>${m}</b><br/>回收率 Recovery <b>${fmt(r.recoveryPct * 100)}%</b> · 可利用热 <b>${fmt(r.usable)} kW</b> · 芯片 <b class="${r.throttle ? 'bad' : ''}">${fmt(r.chip)}°C</b></div>
        <button class="cta" id="w-restart">重新开始 Restart</button><button class="cta ghost" id="w-console">回到控制台 Back to console</button>`,
      bind: () => { $('#w-restart').onclick = () => { Object.assign(state, { guess: null, mission: null, planA: null, sent: {}, checks: {}, hp: false, load: 0.9, supply: 35, flow: 0.6, season: 'winter', cooling: true }); state.pinsSeen.clear(); pinObjs.forEach(o => o.element.classList.remove('seen')); go(0); };
        $('#w-console').onclick = () => go(SCREENS.findIndex(s => s.id === 'S6.2')); },
    };
  },
};

function consoleHTML(compact) {
  return `<div class="row">GPU 负载 Load <b id="v-load"></b></div><input type="range" id="i-load" min="0.3" max="1" step="0.01" value="${state.load}">
    <div class="row">冷却供水温度 Supply temp <b id="v-sup"></b></div><input type="range" id="i-sup" min="25" max="40" step="0.5" value="${state.supply}">
    <div class="row">季节 Season</div><div class="seg">${Object.entries(SEASON).map(([k, s]) => `<button data-season="${k}" class="${state.season === k ? 'on' : ''}">${s.zh} ${s.en}</button>`).join('')}</div>
    ${compact ? '' : `<div class="row">热泵 Heat pump</div><div class="seg"><button data-hp="1" class="${state.hp ? 'on' : ''}">开 On</button><button data-hp="0" class="${state.hp ? '' : 'on'}">关 Off</button></div>`}
    <div class="card" id="v-users"></div>`;
}
function bindConsole() {
  $('#i-load').oninput = e => { state.load = +e.target.value; applyScene(); updateLive(); };
  $('#i-sup').oninput = e => { state.supply = +e.target.value; applyScene(); updateLive(); };
  document.querySelectorAll('[data-season]').forEach(b => b.onclick = () => { state.season = b.dataset.season; applyScene(); renderPanel(); });
  document.querySelectorAll('[data-hp]').forEach(b => b.onclick = () => { state.hp = b.dataset.hp === '1'; applyScene(); renderPanel(); });
}
function liveConsole(r) {
  $('#v-load').textContent = fmt(state.load * 100) + '%';
  $('#v-sup').textContent = fmt(state.supply, 1) + '°C' + (state.supply < 30 ? '（需要制冷机 chiller on）' : '');
  const modeTxt = { direct: '<span class="ok">√ 直接 direct</span>', hp: '<span class="warn">↑ 热泵 via HP</span>', none: '<span class="bad">× 无法供热</span>' };
  $('#v-users').innerHTML = `<div class="row" style="margin-bottom:4px">二次侧 Secondary <b>${fmt(r.T2)}°C</b></div>` +
    USERS.map(u => `<div class="row"><span>${u.zh} (${u.need}°C)</span><span>${modeTxt[r.served[u.k].mode]} ${fmt(r.served[u.k].frac * 100)}%</span></div>`).join('');
}
function liveScore(r) {
  const el = $('#v-score'); if (!el) return;
  const goals = {
    reuse: [r.recoveryPct >= 0.75, `回收率 ${fmt(r.recoveryPct * 100)}%（目标 ≥ 75%）`, '试试冬季 + 开热泵 + 提高供水温度'],
    cost: [r.cost <= 150, `净成本 £${fmt(r.cost)}/h（目标 ≤ £150/h）`, '试试降低负载或提高供水温度，避免开制冷机'],
    safe: [r.chip <= 64, `芯片 ${fmt(r.chip)}°C（目标 ≤ 64°C）`, '试试降低供水温度 —— 但看看回收率会怎样'],
  };
  const g = goals[state.mission]; if (!g) { el.innerHTML = '<span class="en">在 S6.1 选择一个目标后会显示得分。</span>'; return; }
  el.innerHTML = `${g[0] ? '<span class="ok verdict">✓ 达成</span>' : '<span class="warn verdict">未达成</span>'} · ${g[1]}<br/><span class="en">${g[0] ? '再看看其他指标付出了什么代价？What did the other metrics pay for it?' : g[2]}</span>`;
}

let currentLive = null;
function updateLive() { const r = sim(); if (currentLive) currentLive(r); renderMetrics(); }

function renderPanel() {
  const sc = SCREENS[state.i], [n, en] = STEPS[sc.step];
  const w = sc.w ? W[sc.w]() : { html: '' };
  let checkHTML = '';
  if (sc.check) {
    const ans = state.checks[sc.id];
    checkHTML = `<div class="check">检查点 Checkpoint · ${sc.check.q}</div>` + sc.check.opts.map((o, k) => {
      const cls = ans === undefined ? '' : k === sc.check.a ? 'right' : k === ans ? 'wrong' : '';
      return `<button class="opt ${cls}" data-c="${k}">${o}</button>`;
    }).join('');
  }
  $('#panel-body').innerHTML = `<div class="tag">STEP ${n} · ${en} &nbsp; ${sc.id}</div><h1>${sc.title}</h1><div class="en">${sc.en}</div>
    ${sc.body ? `<div class="body">${sc.body}</div>` : ''}${w.html}
    ${sc.learn ? `<div class="learn">用户学到 · ${sc.learn}</div>` : ''}${checkHTML}`;
  w.bind && w.bind();
  document.querySelectorAll('.opt[data-c]').forEach(b => b.onclick = () => { state.checks[sc.id] = +b.dataset.c; renderPanel(); });
  currentLive = w.live || null;
  // nav
  let blocked = false;
  if (sc.gate === 'pins') blocked = state.pinsSeen.size < 4;
  if (sc.gate === 'mission') blocked = !state.mission;
  if (sc.id === 'S0.2') blocked = !state.guess;
  $('#next').disabled = blocked || state.i === SCREENS.length - 1;
  $('#next').textContent = sc.auto ? '自动播放中… Auto ▶' : state.i === SCREENS.length - 1 ? '完成 Done' : '下一步 Next →';
  $('#back').disabled = state.i === 0; $('#back').style.visibility = state.i === 0 ? 'hidden' : 'visible';
  updateLive();
}

let autoTimer;
function go(i) {
  i = THREE.MathUtils.clamp(i, 0, SCREENS.length - 1);
  const prevCam = SCREENS[state.i].cam;
  state.i = i; const sc = SCREENS[i];
  state.maxStep = Math.max(state.maxStep, sc.step);
  if (sc.hp !== undefined) state.hp = sc.hp;
  if (sc.step !== 2) { state.cooling = true; state.chipOverride = 70; }
  if (sc.packet === undefined) packetT = packetTarget = 0;
  if (sc.cam !== prevCam || i === 0) flyTo(sc.cam);
  applyScene(); renderProgress(); renderPanel();
  clearTimeout(autoTimer);
  if (sc.auto) autoTimer = setTimeout(() => { if (state.i === i) go(i + 1); }, sc.auto);
  history.replaceState(null, '', '#' + sc.id);
}

$('#next').onclick = () => go(state.i + 1);
$('#back').onclick = () => go(state.i - 1);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && !$('#next').disabled) go(state.i + 1);
  if (e.key === 'ArrowLeft') go(state.i - 1);
});

// deep link: #S4.3 jumps straight to a screen (handy for reviews)
const start = Math.max(0, SCREENS.findIndex(s => '#' + s.id === location.hash));
if (start > 0) state.maxStep = SCREENS[start].step;
resize(); go(start); frame();
</script>
